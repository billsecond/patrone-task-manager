# Task Manager's helper for its Flatpak (src/host.rs): the computer's /proc,
# /sys, kill and setpriority, for an app in a sandbox that can't see them.
# A crate of its own with no dependencies, linked statically, so it runs on
# whatever C library the computer has.
[package]
name = "patrone-task-manager-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "patrone-task-manager-agent"
path = "src/main.rs"

[profile.release]
opt-level = "s"
